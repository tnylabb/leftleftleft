<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LEFT! LEFT! LEFT! - an asymmetric two-player co-op rally game. Drive blind. Navigate loud. Survive the cabin." />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>LEFT! LEFT! LEFT!</title>
    <style>
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(ellipse at 30% 20%, #3c6a32 0%, #22401f 45%, #12210f 100%); color: #f4efe2;
        font-family: 'Arial Black', Impact, sans-serif; z-index: 10; }
      #boot h1 { margin: 0; font-size: 56px; color: #e8742b; text-shadow: 5px 5px 0 #151513; transform: skew(-8deg) rotate(-2deg); }
      #boot-status { font-family: 'Trebuchet MS', sans-serif; opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="boot"><h1>LEFT! LEFT! LEFT!</h1><div id="boot-status">Loading…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
